<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MATCH LAB</title>
<style>
  body { background:#08080f; color:#d8e0ff; font:13px/1.45 Consolas, monospace; margin:18px; }
  h1 { color:#ffe600; font-size:18px; }
  table { border-collapse:collapse; width:100%; max-width:1200px; margin-top:14px; }
  th, td { border:1px solid #232a55; padding:5px 8px; text-align:left; font-size:12px; }
  th { background:#11162e; color:#38e8ff; }
  .good { color:#7dff5a; font-weight:bold; }
  .mid { color:#ffe600; }
  .bad { color:#ff6b6b; }
  #status { color:#38e8ff; margin:8px 0; }
  code { color:#ff9ad5; }
</style>
</head>
<body>
<h1>PAC-MAN MATCH LAB</h1>
<div id="status">iniciando...</div>
<table id="out"><thead><tr><th>Referencia</th><th>Mejor corr</th><th>Offset (s)</th><th>2º</th><th>Offset 2</th><th>3º</th><th>Offset 3</th></tr></thead><tbody></tbody></table>
<script>
(async () => {
  const status = document.getElementById('status');
  const files = [
    'pacman-sound.mp3',
    'sfx-ref/original_pacman-sounds.mp3',
    'sfx-ref/credit.mp3',
    'sfx-ref/eating.mp3',
    'sfx-ref/eating-ghost.mp3',
    'sfx-ref/eating-fruit.mp3',
    'sfx-ref/extend.mp3',
    'sfx-ref/miss.mp3',
    'sfx-ref/start-music.mp3',
    'sfx-ref/ghost-turn-to-blue.mp3',
    'sfx-ref/ghost-return-to-home.mp3',
    'sfx-ref/ghost-normal-move.mp3',
    'sfx-ref/coffee-break-music.mp3',
  ];
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const buffers = {};
  for (const f of files) {
    try {
      const res = await fetch(f, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      buffers[f] = await ac.decodeAudioData(buf.slice(0));
      status.textContent = 'decodificado ' + f;
    } catch (e) {
      status.textContent = 'ERROR ' + f + ': ' + e.message;
      throw e;
    }
  }

  function monoOf(buf) {
    const len = buf.length, ch = buf.numberOfChannels;
    const out = new Float32Array(len);
    for (let c = 0; c < ch; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) out[i] += d[i] / ch;
    }
    return out;
  }
  function resample(x, src, dst) {
    const n = Math.floor(x.length * dst / src);
    const out = new Float32Array(n);
    const ratio = src / dst;
    for (let i = 0; i < n; i++) {
      const p = i * ratio;
      const i0 = Math.floor(p), i1 = Math.min(x.length - 1, i0 + 1);
      const t = p - i0;
      out[i] = x[i0] * (1 - t) + x[i1] * t;
    }
    return out;
  }
  function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = -2 * Math.PI / size;
      for (let i = 0; i < n; i += size) {
        for (let k = 0; k < half; k++) {
          const ang = step * k, wr = Math.cos(ang), wi = Math.sin(ang);
          const ar = re[i + k + half], ai = im[i + k + half];
          const tr = ar * wr - ai * wi, ti = ar * wi + ai * wr;
          re[i + k + half] = re[i + k] - tr; im[i + k + half] = im[i + k] - ti;
          re[i + k] += tr; im[i + k] += ti;
        }
      }
    }
  }
  function correlate(x, r) {
    // x: target, r: reference. Returns array of correlations per lag (lag = start in x)
    const L = r.length, N = x.length;
    if (L > N) return { lags: [], corr: new Float32Array(0) };
    const size = nextPow2(N + L);
    const xr = new Float32Array(size), xi = new Float32Array(size);
    const rr = new Float32Array(size), ri = new Float32Array(size);
    let meanR = 0;
    for (let i = 0; i < L; i++) meanR += r[i];
    meanR /= L;
    for (let i = 0; i < N; i++) xr[i] = x[i];
    for (let i = 0; i < L; i++) rr[i] = r[L - 1 - i] - meanR;
    let rrEnergy = 0;
    for (let i = 0; i < L; i++) rrEnergy += rr[i] * rr[i];
    fft(xr, xi); fft(rr, ri);
    for (let i = 0; i < size; i++) {
      const ar = xr[i], ai = xi[i], br = rr[i], bi = ri[i];
      xr[i] = ar * br - ai * bi;
      xi[i] = ar * bi + ai * br;
    }
    // inverse
    for (let i = 0; i < size; i++) xi[i] = -xi[i];
    fft(xr, xi);
    const dot = new Float32Array(N - L + 1);
    // convolution result at index i + L - 1 = lag dot
    for (let lag = 0; lag <= N - L; lag++) dot[lag] = xr[lag + L - 1] / size;
    // prefix sums for local mean / energy
    const pre = new Float64Array(N + 1), pre2 = new Float64Array(N + 1);
    for (let i = 0; i < N; i++) { pre[i + 1] = pre[i] + x[i]; pre2[i + 1] = pre2[i] + x[i] * x[i]; }
    const corr = new Float32Array(N - L + 1);
    for (let lag = 0; lag <= N - L; lag++) {
      const s = pre[lag + L] - pre[lag];
      const ss = pre2[lag + L] - pre2[lag];
      const varr = ss - s * s / L;
      if (varr <= 1e-9 || rrEnergy <= 1e-9) { corr[lag] = 0; continue; }
      corr[lag] = dot[lag] / Math.sqrt(varr * rrEnergy);
    }
    return { corr, lags: (N - L + 1) };
  }

  const targetName = 'pacman-sound.mp3';
  const target = resample(monoOf(buffers[targetName]), buffers[targetName].sampleRate, 8000);
  const results = [];
  for (const f of files) {
    if (f === targetName) continue;
    const ref = resample(monoOf(buffers[f]), buffers[f].sampleRate, 8000);
    status.textContent = 'correlacionando ' + f + ' (' + (ref.length / 8000).toFixed(2) + 's)...';
    await new Promise(r => setTimeout(r, 0));
    if (ref.length > target.length) { results.push({ f, best: [], tooLong: true }); continue; }
    const { corr } = correlate(target, ref);
    let top = [];
    for (let i = 0; i < corr.length; i++) {
      const v = Math.abs(corr[i]);
      if (top.length < 3) { top.push({ v, i }); top.sort((a, b) => b.v - a.v); }
      else if (v > top[2].v) { top[2] = { v, i }; top.sort((a, b) => b.v - a.v); }
    }
    results.push({ f, best: top.map(t => ({ corr: +t.v.toFixed(3), offset: +(t.i / 8000).toFixed(3) })) });
  }

  const tbody = document.querySelector('#out tbody');
  for (const r of results) {
    const tr = document.createElement('tr');
    const b = r.best;
    const cls = v => v >= 0.5 ? 'good' : v >= 0.25 ? 'mid' : 'bad';
    tr.innerHTML = `<td><code>${r.f.replace('sfx-ref/', '')}</code></td>` +
      (r.tooLong ? '<td colspan="6">referencia mas larga que el objetivo</td>' :
      `<td class="${cls(b[0] && b[0].corr || 0)}">${b[0] ? b[0].corr : 0}</td><td>${b[0] ? b[0].offset : '-'}</td>` +
      `<td>${b[1] ? b[1].corr : '-'}</td><td>${b[1] ? b[1].offset : '-'}</td>` +
      `<td>${b[2] ? b[2].corr : '-'}</td><td>${b[2] ? b[2].offset : '-'}</td>`);
    tbody.appendChild(tr);
  }
  window.MATCHES = results;
  window.MATCH_DURATIONS = Object.fromEntries(files.map(f => [f, +buffers[f].duration.toFixed(3)]));
  status.textContent = 'listo';
})().catch(e => { document.getElementById('status').textContent = 'ERROR: ' + e.message; console.error(e); });
</script>
</body>
</html>
